{{- if .Values.credentialsSecret.name }}
{{- $namespace := default .Release.Namespace .Values.credentialsSecret.namespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cert-manager-webhook-123domain.fullname" . }}-credentials-reader
  namespace: {{ $namespace | quote }}
  labels:
    app: {{ include "cert-manager-webhook-123domain.name" . }}
    chart: {{ include "cert-manager-webhook-123domain.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.credentialsSecret.name | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cert-manager-webhook-123domain.fullname" . }}-credentials-reader
  namespace: {{ $namespace | quote }}
  labels:
    app: {{ include "cert-manager-webhook-123domain.name" . }}
    chart: {{ include "cert-manager-webhook-123domain.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cert-manager-webhook-123domain.fullname" . }}-credentials-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "cert-manager-webhook-123domain.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
