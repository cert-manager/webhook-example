apiVersion: v1
kind: Service
metadata:
  name: {{ include "cert-manager-webhook-123domain.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: {{ include "cert-manager-webhook-123domain.name" . }}
    chart: {{ include "cert-manager-webhook-123domain.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: https
      protocol: TCP
      name: https
    - name: metrics
      port: 8080
      protocol: TCP
      targetPort: metrics
  selector:
    app: {{ include "cert-manager-webhook-123domain.name" . }}
    release: {{ .Release.Name }}
